name: QJMobile
options:
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'NO'
    CLANG_ENABLE_MODULES: 'YES'
targets:
  QJMobile:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: build/Licenses
        type: folder
        buildPhase: resources
    info:
      path: build/App-Info.plist
      properties:
        CFBundleDisplayName: 简词键盘
        CFBundleIdentifier: app.qjmobile.personal
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qjmobile.personal
    dependencies:
      - target: QJKeyboard
        embed: true
  QJKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Keyboard
        excludes: [BridgingHeader.h]
      - path: ios/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: build/Data
        buildPhase: resources
    info:
      path: build/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 简词键盘
        CFBundleIdentifier: app.qjmobile.personal.keyboard
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qjmobile.personal.keyboard
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ios/Keyboard/BridgingHeader.h
        OTHER_LDFLAGS: ['$(inherited)', '-lqjmobile', '-lc++', '-liconv']
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(SRCROOT)/target/aarch64-apple-ios/release
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(SRCROOT)/target/aarch64-apple-ios-sim/release
  QJMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Tests
      - path: ios/Keyboard
        excludes: [BridgingHeader.h]
      - path: build/Data
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qjmobile.personal.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ios/Keyboard/BridgingHeader.h
        OTHER_LDFLAGS: ['$(inherited)', '-lqjmobile', '-lc++', '-liconv']
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/target/aarch64-apple-ios-sim/release
schemes:
  QJMobile:
    build:
      targets:
        QJMobile: all
        QJKeyboard: all
    run:
      config: Debug
  QJMobileTests:
    build:
      targets:
        QJMobileTests: all
    test:
      config: Release
      targets:
        - QJMobileTests
