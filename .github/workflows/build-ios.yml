name: Build iPhone keyboard
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'full = 中文拼音和英文译词；bootstrap = 基础键盘安装验证'
        type: choice
        options: [full, bootstrap]
        default: full
permissions:
  contents: read
concurrency:
  group: qjmobile-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup update stable
          rustup default stable
          xcodebuild -version
          rustc --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Resolve lockfile for initial build
        if: inputs.variant == 'full'
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: Rust tests
        if: inputs.variant == 'full'
        run: cargo test --workspace --locked
      - name: Build app and keyboard
        run: |
          if [ '${{ inputs.variant }}' = 'bootstrap' ]; then
            python3 scripts/build_ios.py --bootstrap
          else
            python3 scripts/build_ios.py
          fi
      - name: Simulator smoke test
        run: python3 scripts/simulator_smoke.py
      - name: Upload install package and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QJMobile-${{ inputs.variant }}-${{ github.run_number }}
          path: |
            build/*.ipa
            build/*report.json
            build/*screenshot.png
            build/QJMobile-simulator.zip
            Cargo.lock
          retention-days: 7
          if-no-files-found: warn
